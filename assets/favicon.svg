<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Blue-Purple Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- Metallic Gold Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glowing Cyan Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00F0FF" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Vibrant Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#bgGrad)" />
  
  <!-- Dark Calendar Disk Backdrop -->
  <circle cx="32" cy="32" r="21" fill="#0B0F19" fill-opacity="0.85" />

  <!-- Subtle Neon Matrix Grid Lines -->
  <path d="M18 24 H46 M18 32 H46 M18 40 H46" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />
  <path d="M24 18 V46 M32 18 V46 M40 18 V46" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />

  <!-- Golden Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#goldGrad)" stroke-width="3" fill="none" />

  <!-- Glowing Neon Cyan Checkmark -->
  <path d="M22 32.5 L28.5 39 L42 24.5" stroke="#00F5D4" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <path d="M22 32.5 L28.5 39 L42 24.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
